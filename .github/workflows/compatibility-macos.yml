# macOS compatibility. Does not publish. Independent of Linux and Windows.
name: Compatibility macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: compatibility-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  BUN_VERSION: "1.4.2"
  FULVID_SMOKE_LAUNCH: "1"

jobs:
  macos:
    name: macOS 26 Apple Silicon
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-compat-macos-26-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-compat-macos-26-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package macOS
        run: bash packaging/macos/package.sh

      - name: Doctor
        run: bun run doctor

      - name: Compatibility smoke
        run: bun run smoke:compatibility

      - name: Lua packaged smoke
        run: bun run smoke:lua-packaged

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-macos-26
          path: |
            artifacts/build.log
            dist/index.html
          if-no-files-found: ignore
