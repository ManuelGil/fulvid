# macOS compatibility. Does not publish. Independent of Linux and Windows.
name: Compatibility macOS

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: compatibility-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  BUN_VERSION: "1.4.2"
  FULVID_SMOKE_LAUNCH: "1"

jobs:
  macos:
    name: macOS 26 Apple Silicon
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-compat-macos-26-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-compat-macos-26-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            bun install --frozen-lockfile --ignore-scripts
          else
            bun install --frozen-lockfile
          fi

      - name: Package macOS
        run: bash packaging/macos/package.sh

      - name: Doctor
        run: bun run doctor

      - name: Compatibility smoke
        run: bun run smoke:compatibility

      - name: Lua packaged smoke
        run: bun run smoke:lua-packaged

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-macos-26
          path: |
            artifacts/build.log
            dist/index.html
          if-no-files-found: ignore
