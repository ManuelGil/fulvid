# Linux compatibility. Does not publish. Independent of Windows and macOS.
name: Compatibility Linux

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: compatibility-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "20"
  FULVID_SMOKE_LAUNCH: "1"
  GDK_BACKEND: x11
  WEBKIT_DISABLE_COMPOSITING_MODE: "1"

jobs:
  ubuntu:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native libraries
        run: |
          set -euo pipefail
          mapfile -t runtime_packages < <(bash packaging/linux/list-runtime-packages.sh)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus \
            xvfb \
            "${runtime_packages[@]}"

      - name: Record native stack
        run: |
          set -euo pipefail
          {
            echo "## Ubuntu 24.04 native stack"
            echo
            echo '```text'
            ldd_version="$(ldd --version)"
            printf '%s\n' "${ldd_version%%$'\n'*}"
            mapfile -t runtime_packages < <(bash packaging/linux/list-runtime-packages.sh)
            dpkg-query -W -- "${runtime_packages[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-compat-linux-ubuntu-24.04-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-compat-linux-ubuntu-24.04-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package Linux
        run: bash packaging/linux/package.sh

      - name: Doctor
        run: bun run doctor

      - name: Compatibility smoke
        run: dbus-run-session -- xvfb-run -a bun run smoke:compatibility

      - name: Lua packaged smoke
        run: bun run smoke:lua-packaged

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-linux-ubuntu-24.04
          path: |
            artifacts/build.log
            dist/index.html
          if-no-files-found: ignore

  debian:
    name: Debian 13 (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:13
      options: --init
    defaults:
      run:
        shell: bash

    steps:
      - name: Install container tools
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            unzip \
            xvfb \
            xauth \
            dbus \
            dpkg \
            procps \
            zstd

      - name: Record native stack
        run: |
          set -euo pipefail
          {
            echo "## Debian 13 native stack"
            echo
            echo '```text'
            cat /etc/os-release
            ldd_version="$(ldd --version)"
            printf '%s\n' "${ldd_version%%$'\n'*}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install runtime libraries
        run: |
          set -euo pipefail
          mapfile -t runtime_packages < <(bash packaging/linux/list-runtime-packages.sh)
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            "${runtime_packages[@]}"
          {
            echo
            echo '```text'
            dpkg-query -W -- "${runtime_packages[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-compat-linux-debian13-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-compat-linux-debian13-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package Linux
        run: bash packaging/linux/package.sh

      - name: Doctor
        run: bun run doctor

      - name: Verify Xvfb tools
        run: |
          set -euo pipefail
          command -v dbus-run-session
          command -v xvfb-run
          command -v xauth

      - name: Compatibility smoke
        run: dbus-run-session -- xvfb-run -a bun run smoke:compatibility

      - name: Lua packaged smoke
        run: bun run smoke:lua-packaged

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-linux-debian-13
          path: |
            artifacts/build.log
            dist/index.html
          if-no-files-found: ignore
