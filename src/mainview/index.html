<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <!--
      Document content is data, never active content. These directives close the
      vectors a Markdown or MDX document could reach even if Preview escaping
      regressed: no plugins, no frames, no form submission, no `<base>` rewrite.

      `script-src`, `style-src`, `img-src`, and `worker-src` are unset on
      purpose. Fulvid pins monaco-editor 0.56.0 and Vite 8. Workers are Vite
      `?worker` constructors (Monaco in monacoSetup.ts, Graph in
      computeComposedGraph.ts), so Monaco's default blob-worker loader is not
      the reason these stay open. They stay open because:

      - Vite HMR (`bun run dev:hmr`) injects inline module scripts. A
        `script-src` without a nonce or 'unsafe-inline' would break that
        session. Packaged pages load from `views://mainview/index.html`.
      - Monaco 0.56 injects `<style>` at runtime; `style-src` without
        'unsafe-inline' or a nonce would likely break editor chrome.
      - Whether `script-src 'self'` / `worker-src 'self'` hold for `views://`
        in Electrobun 2.0.1 system webviews (WKWebView / WebView2 / WebKitGTK)
        has not been verified in a packaged run. This HTML is shared by HMR
        and packaged builds; a production-only policy is the first experiment
        after that check, not a second HTML file beforehand.

      TODO(security): Revisit these omitted directives when upgrading Monaco,
      Vite, or Electrobun, or when changing worker bundling. Before setting
      script-src / worker-src / style-src, verify `bun run dev:hmr` and a
      packaged build on Linux, macOS, and Windows. Do not assume `'self'`
      matches `views://`.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fulvid</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
